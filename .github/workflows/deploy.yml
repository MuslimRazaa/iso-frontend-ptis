name: Deploy Frontend to cPanel

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Build React App
        run: npm run build

      - name: Commit dist folder
        run: |
          git config --global user.email "zamirkha@gmail.com"
          git config --global user.name "MuslimRazaa"
          git add dist/ -f
          git commit -m "Auto build dist" || echo "Nothing to commit"
          git push origin main

      # Committing the build to git does not put it on the server: the host has
      # to pull it. Without this the site kept serving the previous bundle until
      # someone deployed by hand, which reads as "the change never shipped".
      # Never fails the run - the build is committed either way - and the HTTP
      # code is printed so a missing or rejected secret is visible in the log.
      - name: Trigger Deployment Webhook
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" "https://ptis.co/deploy.php?secret=${{ secrets.DEPLOY_SECRET }}")
          echo "deploy.php responded $code"
          if [ "$code" != "200" ]; then
            echo "::warning::Deploy webhook returned $code - the host may still be serving the previous build."
          fi